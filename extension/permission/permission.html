<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Chat - Microphone Access</title>
    <style>
      :root {
        --bg: #090d16;
        --card-bg: #121826;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --success: #10b981;
        --error: #ef4444;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background-color: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 40px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .icon-box {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(59, 130, 246, 0.15);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }
      .icon-box svg { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
      p { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; }
      .btn {
        background-color: var(--accent);
        color: white;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 28px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }
      .btn:hover { background-color: var(--accent-hover); }
      .btn:active { transform: scale(0.98); }
      .status-message {
        margin-top: 20px;
        font-size: 14px;
        font-weight: 500;
        display: none;
      }
      .status-message.success { color: var(--success); display: block; }
      .status-message.error { color: var(--error); display: block; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box" id="icon-container">
        <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"></path></svg>
      </div>
      <h1>Microphone Permission Required</h1>
      <p>Voice Chat needs microphone access to connect your voice calls with other participants. Click the button below and select <strong>Allow</strong> when Chrome prompts you.</p>
      <button class="btn" id="grant-btn">Allow Microphone Access</button>
      <div class="status-message" id="status-msg"></div>
    </div>
    <script src="permission.js"></script>
  </body>
</html>
